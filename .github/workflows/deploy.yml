name: deploy

# 公開の経路（Vercel GitHub連携が使えない場合の予備経路）:
#   PR        → プレビューをデプロイし、URLをPRにコメント
#   main push → 本番（layr.co.jp）へデプロイ
# 必要な secret: VERCEL_TOKEN（Vercelのアカウントトークン。河出が設定）
# Vercel の GitHub 連携（Project → Settings → Git）を有効にした場合は、
# 連携側が同じことをするので、このワークフローは二重実行を避けるため無効化してよい。
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_CEYhyvgPy7EUP42pUit3BadX
  VERCEL_PROJECT_ID: prj_3zlFubkOc9Uazv9HQWSvJTYf6vOD

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx vercel@latest deploy --yes --token="$VERCEL_TOKEN" 2>/dev/null | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `🔍 プレビュー: ${url}\n\n1280 / 768 / 390 の3幅で確認してください。`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
