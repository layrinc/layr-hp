name: deploy (manual fallback)

# 通常の公開経路は Vercel の GitHub 連携（Project → Settings → Git → layrinc/layr-hp、2026-09-06 接続済み）:
#   PR        → Vercel がプレビューを自動発行し、PR に URL をコメント
#   main push → Vercel が本番（layr.co.jp）へ自動公開
# このワークフローは連携が使えなくなった時の予備経路。手動実行（Actions → Run workflow）のみ。
# 必要な secret: VERCEL_TOKEN（Vercel のアカウントトークン。河出が設定）
on:
  workflow_dispatch:
    inputs:
      target:
        description: "preview か production"
        required: true
        default: preview
        type: choice
        options: [preview, production]

env:
  VERCEL_ORG_ID: team_CEYhyvgPy7EUP42pUit3BadX
  VERCEL_PROJECT_ID: prj_3zlFubkOc9Uazv9HQWSvJTYf6vOD

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN が未設定です。Vercel の GitHub 連携を使うか、secret を設定してください。" >&2
            exit 1
          fi
          if [ "${{ inputs.target }}" = "production" ]; then
            npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            npx vercel@latest deploy --yes --token="$VERCEL_TOKEN"
          fi
