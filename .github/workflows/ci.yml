name: ci

# PRと main への push で、ビルドとデザインゲートの回帰チェックを回す。
# 落ちたPRはマージできない（main のブランチ保護でこのチェックを必須にしている）。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build（全ページが生成されること）
        run: npm run build

      - name: LINE支援カード・FAQ（表示内容・構造化データ・JSなしの閲覧を検証）
        run: node --test tests/line-support.test.mjs

      - name: 採用LINE地域SEO（公開範囲・コンテンツ・計測・内部リンクを検証）
        run: node --test tests/ltori-seo.test.mjs tests/seo-manager.test.mjs tests/ltori-analytics.test.mjs tests/seo-access.test.mjs

      - name: 採用コラム（公開条件・SEO・相談導線を検証）
        run: node --test tests/ltori-media.test.mjs tests/lead-attribution.test.mjs tests/media-contact.test.mjs

      - name: メディア管理（検索需要・Google連携・保存を検証）
        run: node --test tests/media-manager-*.test.mjs

      - name: SEOワークスペース統合（施策別集計・改善管理・画面切り替えを検証）
        run: node --test tests/seo-workspace.test.mjs tests/seo-workspace-client.test.mjs tests/seo-growth-navigation.test.mjs tests/seo-regional-server-analytics.test.mjs

      - name: 記事制作の統合（認証・接続・編集・安全な表示を検証）
        run: node --test tests/kiji-*.test.mjs

      - name: SEO自動運用（認証・D1・公開上限・計測・診断）
        run: node --test tests/seo-store.test.mjs tests/seo-leads.test.mjs tests/seo-api.test.mjs tests/seo-publication.test.mjs tests/seo-publication-runtime.test.mjs tests/seo-analytics-server.test.mjs tests/seo-analytics-runtime.test.mjs tests/seo-media-analytics.test.mjs tests/seo-growth.test.mjs tests/ltori-diagnosis.test.mjs tests/ltori-contact.test.mjs

      - name: 定期実行のGitHub認証・重複防止
        run: node --test tests/seo-scheduler*.test.mjs

      - name: Design gate regression（基準値から1項目でも悪化していれば失敗）
        run: bash scripts/gate-regression.sh

      - name: Validate Cloudflare configuration（アップロードなし）
        run: npm run check:cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
