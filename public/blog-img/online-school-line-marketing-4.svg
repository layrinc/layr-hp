<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="1200" height="440" rx="20" fill="#F6FAF9"/>
  <text x="600" y="56" text-anchor="middle" font-size="24" font-weight="800" fill="#0E1A1C">広告は「登録単価」ではなく「その先の予約・成約」で比べる</text>
  <rect x="60" y="110" width="520" height="270" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
  <text x="92" y="156" font-size="20" font-weight="800" fill="#0E1A1C">広告A</text>
  <text x="180" y="156" font-size="15" fill="#5A6B6D">登録単価が安い</text>
  <line x1="92" y1="174" x2="548" y2="174" stroke="#E3ECEA" stroke-width="1.5"/>
  <text x="92" y="204" font-size="16" fill="#0E1A1C">登録単価</text>
  <text x="548" y="204" text-anchor="end" font-size="18" font-weight="800" fill="#0E4F44">安い</text>
  <line x1="92" y1="230" x2="548" y2="230" stroke="#E3ECEA" stroke-width="1.5"/>
  <text x="92" y="260" font-size="16" fill="#0E1A1C">予約・成約</text>
  <text x="548" y="260" text-anchor="end" font-size="18" font-weight="800" fill="#5A6B6D">少ない</text>
  <line x1="92" y1="286" x2="548" y2="286" stroke="#E3ECEA" stroke-width="1.5"/>
  <text x="92" y="316" font-size="16" fill="#0E1A1C">売上への貢献</text>
  <text x="548" y="316" text-anchor="end" font-size="18" font-weight="800" fill="#5A6B6D">小さい</text>
  <text x="320" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6B6D">登録単価だけ見ると選びがち</text>
  <rect x="620" y="110" width="520" height="270" rx="16" fill="#fff" stroke="#17A673" stroke-width="2.5"/>
  <text x="652" y="156" font-size="20" font-weight="800" fill="#0E1A1C">広告B</text>
  <text x="740" y="156" font-size="15" fill="#5A6B6D">登録単価が高い</text>
  <line x1="652" y1="174" x2="1108" y2="174" stroke="#E3ECEA" stroke-width="1.5"/>
  <text x="652" y="204" font-size="16" fill="#0E1A1C">登録単価</text>
  <text x="1108" y="204" text-anchor="end" font-size="18" font-weight="800" fill="#5A6B6D">高い</text>
  <line x1="652" y1="230" x2="1108" y2="230" stroke="#E3ECEA" stroke-width="1.5"/>
  <text x="652" y="260" font-size="16" fill="#0E1A1C">予約・成約</text>
  <text x="1108" y="260" text-anchor="end" font-size="18" font-weight="800" fill="#0E4F44">多い</text>
  <line x1="652" y1="286" x2="1108" y2="286" stroke="#E3ECEA" stroke-width="1.5"/>
  <text x="652" y="316" font-size="16" fill="#0E1A1C">売上への貢献</text>
  <text x="1108" y="316" text-anchor="end" font-size="18" font-weight="800" fill="#0E4F44">大きい</text>
  <text x="880" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#0E4F44">こちらに予算を寄せる</text>
  <text x="600" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#0E4F44">流入経路ごとにタグを付け、どの広告から来た人が予約したかを追う</text>
</svg>
