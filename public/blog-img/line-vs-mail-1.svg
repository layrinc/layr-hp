<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="1200" height="540" rx="20" fill="#F6FAF9"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="800" fill="#0E1A1C">開封率の差は「文章力の差」ではなく「届き方の差」</text>
  <!-- mail card -->
  <g>
    <rect x="60" y="90" width="520" height="340" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <text x="320" y="140" text-anchor="middle" font-size="18" font-weight="800" fill="#5A6B6D">✉️ メルマガ</text>
    <text x="320" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#5A6B6D">開封率の目安</text>
    <text x="320" y="232" text-anchor="middle" font-size="46" font-weight="800" fill="#0E1A1C">10〜20<tspan font-size="24">%前後</tspan></text>
    <rect x="120" y="262" width="400" height="14" rx="7" fill="#EEF3F2"/>
    <rect x="120" y="262" width="80" height="14" rx="7" fill="#9AA7A9"/>
    <text x="320" y="330" text-anchor="middle" font-size="13" fill="#5A6B6D">迷惑メール・プロモーションタブに振り分けられ</text>
    <text x="320" y="356" text-anchor="middle" font-size="13" fill="#5A6B6D">そもそも目に入らないことが多い</text>
  </g>
  <!-- LINE card -->
  <g>
    <rect x="620" y="90" width="520" height="340" rx="16" fill="#fff" stroke="#17A673" stroke-width="2.5"/>
    <text x="880" y="140" text-anchor="middle" font-size="18" font-weight="800" fill="#0E4F44">💬 LINE公式アカウント</text>
    <text x="880" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#0E4F44">開封率の目安</text>
    <text x="880" y="232" text-anchor="middle" font-size="46" font-weight="800" fill="#0E4F44">50<tspan font-size="24">%超のケースが多い</tspan></text>
    <rect x="680" y="262" width="400" height="14" rx="7" fill="#EEF3F2"/>
    <rect x="680" y="262" width="220" height="14" rx="7" fill="#17A673"/>
    <text x="880" y="330" text-anchor="middle" font-size="13" fill="#5A6B6D">スマホにプッシュ通知が届き</text>
    <text x="880" y="356" text-anchor="middle" font-size="13" fill="#5A6B6D">普段使うトーク一覧に表示される</text>
  </g>
  <text x="600" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#0E4F44">「読まれる場所に届くか」の時点で勝負がついている</text>
  <text x="600" y="508" text-anchor="middle" font-size="12" fill="#5A6B6D">※ 開封率は一般的な目安です。業種や配信内容によって変わります。</text>
</svg>
