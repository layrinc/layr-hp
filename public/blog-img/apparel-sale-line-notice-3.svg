<text x="975" y="314" font-size="13" font-weight="700" fill="#00BF63" text-anchor="middle" letter-spacing="2">STEP4</text>
<text x="975" y="366" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">残り日数を1〜2回リマインド配</text>
<text x="975" y="390" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">信</text>
