<text x="725" y="366" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">開始同時〜数時間後に一般友だち</text>
<text x="725" y="390" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">へ告知</text>
<circle cx="975" cy="239" r="88.5" fill="#FFFFFF" stroke="url(#g)" stroke-width="9"/>
