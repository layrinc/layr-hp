<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="1200" height="450" rx="20" fill="#F6FAF9"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="800" fill="#0E1A1C">LINEに任せる接点・メールに任せる接点</text>
  <!-- LINE card -->
  <g>
    <rect x="60" y="95" width="520" height="260" rx="16" fill="#fff" stroke="#17A673" stroke-width="2.5"/>
    <text x="320" y="142" text-anchor="middle" font-size="18" font-weight="800" fill="#0E4F44">💬 LINEが得意な接点</text>
    <text x="320" y="196" text-anchor="middle" font-size="14.5" fill="#0E1A1C"><tspan font-weight="800" fill="#17A673">✓ </tspan>BtoCの継続的な顧客接点</text>
    <text x="320" y="244" text-anchor="middle" font-size="14.5" fill="#0E1A1C"><tspan font-weight="800" fill="#17A673">✓ </tspan>再来店リマインド・クーポン</text>
    <text x="320" y="292" text-anchor="middle" font-size="14.5" fill="#0E1A1C"><tspan font-weight="800" fill="#17A673">✓ </tspan>売上に直結するオファー配信</text>
  </g>
  <!-- mail card -->
  <g>
    <rect x="620" y="95" width="520" height="260" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <text x="880" y="142" text-anchor="middle" font-size="18" font-weight="800" fill="#5A6B6D">✉️ メールが向いている接点</text>
    <text x="880" y="196" text-anchor="middle" font-size="14.5" fill="#0E1A1C"><tspan font-weight="800" fill="#5A6B6D">✓ </tspan>記録性が必要なBtoBの商談・見積もり</text>
    <text x="880" y="244" text-anchor="middle" font-size="14.5" fill="#0E1A1C"><tspan font-weight="800" fill="#5A6B6D">✓ </tspan>長文の資料・レポートの送付</text>
    <text x="880" y="292" text-anchor="middle" font-size="14.5" fill="#0E1A1C"><tspan font-weight="800" fill="#5A6B6D">✓ </tspan>PCで業務中に読まれるコンテンツ</text>
  </g>
  <text x="600" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#0E4F44">「どちらを使うか」ではなく「どの接点をどちらに任せるか」で考える</text>
</svg>
