<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="1200" height="500" rx="20" fill="#F6FAF9"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="800" fill="#0E1A1C">LINEを受け皿にした集客の基本構造</text>
  <g>
    <rect x="60" y="110" width="240" height="150" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <text x="180" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6B6D">広告・SNS・店頭POP</text>
    <text x="180" y="212" text-anchor="middle" font-size="34" font-weight="800" fill="#0E1A1C">集客費</text>
  </g>
  <g>
    <rect x="370" y="110" width="240" height="150" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <text x="490" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6B6D">獲得単価は予約CPAより安い</text>
    <text x="490" y="212" text-anchor="middle" font-size="34" font-weight="800" fill="#0E1A1C">友だち</text>
  </g>
  <g>
    <rect x="680" y="110" width="240" height="150" rx="16" fill="#EDF7F2" stroke="#17A673" stroke-width="2.5"/>
    <text x="800" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#0E4F44">あいさつ＋ステップ配信</text>
    <text x="800" y="212" text-anchor="middle" font-size="34" font-weight="800" fill="#0E4F44">配信</text>
  </g>
  <g>
    <rect x="990" y="95" width="170" height="180" rx="16" fill="#0E4F44"/>
    <text x="1075" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#9FD4C3">初回＋リピート</text>
    <text x="1075" y="200" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">売上</text>
    <text x="1075" y="245" text-anchor="middle" font-size="11.5" fill="#9FD4C3">無料で何度でも</text>
  </g>
  <text x="335" y="192" text-anchor="middle" font-size="24" font-weight="800" fill="#17A673">›</text>
  <text x="645" y="192" text-anchor="middle" font-size="24" font-weight="800" fill="#17A673">›</text>
  <text x="955" y="192" text-anchor="middle" font-size="24" font-weight="800" fill="#17A673">›</text>
  <rect x="60" y="310" width="1100" height="120" rx="14" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
  <text x="600" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#0E1A1C">「安く獲得して、LINEで育てて、無料で何度でも売上機会を作る」</text>
  <text x="600" y="398" text-anchor="middle" font-size="13" fill="#5A6B6D">一度獲得した友だちへのアプローチに、追加の集客費はかからない</text>
</svg>
