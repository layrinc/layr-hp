<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="1200" height="500" rx="20" fill="#F6FAF9"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="800" fill="#0E1A1C">月500組来店する店舗のシミュレーション例</text>
  <g>
    <rect x="60" y="110" width="240" height="150" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <text x="180" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6B6D">月間来店</text>
    <text x="180" y="205" text-anchor="middle" font-size="42" font-weight="800" fill="#0E1A1C">500<tspan font-size="18">組</tspan></text>
  </g>
  <g>
    <rect x="370" y="110" width="240" height="150" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <text x="490" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6B6D">アンケート参加（20%）</text>
    <text x="490" y="205" text-anchor="middle" font-size="42" font-weight="800" fill="#0E1A1C">100<tspan font-size="18">組</tspan></text>
  </g>
  <g>
    <rect x="680" y="110" width="240" height="150" rx="16" fill="#EDF7F2" stroke="#17A673" stroke-width="2.5"/>
    <text x="800" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#0E4F44">LINE登録（70%）</text>
    <text x="800" y="205" text-anchor="middle" font-size="42" font-weight="800" fill="#0E4F44">70<tspan font-size="18">人/月</tspan></text>
  </g>
  <g>
    <rect x="990" y="95" width="170" height="180" rx="16" fill="#0E4F44"/>
    <text x="1075" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#9FD4C3">年間リスト</text>
    <text x="1075" y="195" text-anchor="middle" font-size="40" font-weight="800" fill="#fff">840<tspan font-size="16">人</tspan></text>
    <text x="1075" y="240" text-anchor="middle" font-size="11.5" fill="#9FD4C3">70人 × 12ヶ月</text>
  </g>
  <text x="335" y="192" text-anchor="middle" font-size="24" font-weight="800" fill="#17A673">›</text>
  <text x="645" y="192" text-anchor="middle" font-size="24" font-weight="800" fill="#17A673">›</text>
  <text x="955" y="192" text-anchor="middle" font-size="24" font-weight="800" fill="#17A673">›</text>
  <rect x="60" y="310" width="1100" height="120" rx="14" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
  <text x="600" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#0E1A1C">広告費をかけずに、840人へ「また来てください」と直接届けられる</text>
  <text x="600" y="398" text-anchor="middle" font-size="13" fill="#5A6B6D">※ 参加率20%・登録率70%は仮定の数値です。特典設計と店内の声かけで変わります。</text>
</svg>
