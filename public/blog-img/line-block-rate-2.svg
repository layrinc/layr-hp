<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="1200" height="460" rx="20" fill="#F6FAF9"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="800" fill="#0E1A1C">属性取得からセグメント配信までの3ステップ</text>
  <g>
    <rect x="80" y="90" width="320" height="240" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <circle cx="240" cy="140" r="26" fill="#0E4F44"/><text x="240" y="149" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">1</text>
    <text x="240" y="200" text-anchor="middle" font-size="17" font-weight="800" fill="#0E1A1C">あいさつで質問する</text>
    <text x="240" y="232" text-anchor="middle" font-size="12.5" fill="#5A6B6D">友だち追加直後のあいさつに</text>
    <text x="240" y="254" text-anchor="middle" font-size="12.5" fill="#5A6B6D">選択式の質問を1〜3個入れる</text>
    <text x="240" y="300" text-anchor="middle" font-size="30">📝</text>
  </g>
  <g>
    <rect x="440" y="90" width="320" height="240" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <circle cx="600" cy="140" r="26" fill="#0E4F44"/><text x="600" y="149" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text>
    <text x="600" y="200" text-anchor="middle" font-size="17" font-weight="800" fill="#0E1A1C">回答でタグを付与</text>
    <text x="600" y="232" text-anchor="middle" font-size="12.5" fill="#5A6B6D">回答内容に応じて</text>
    <text x="600" y="254" text-anchor="middle" font-size="12.5" fill="#5A6B6D">友だちにタグを付ける</text>
    <text x="600" y="300" text-anchor="middle" font-size="30">🏷️</text>
  </g>
  <g>
    <rect x="800" y="90" width="320" height="240" rx="16" fill="#fff" stroke="#17A673" stroke-width="2.5"/>
    <circle cx="960" cy="140" r="26" fill="#17A673"/><text x="960" y="149" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">3</text>
    <text x="960" y="200" text-anchor="middle" font-size="17" font-weight="800" fill="#0E1A1C">タグごとに出し分け</text>
    <text x="960" y="232" text-anchor="middle" font-size="12.5" fill="#5A6B6D">以降の配信はタグごとに</text>
    <text x="960" y="254" text-anchor="middle" font-size="12.5" fill="#0E4F44" font-weight="700">内容を出し分ける</text>
    <text x="960" y="300" text-anchor="middle" font-size="30">📬</text>
  </g>
  <text x="420" y="218" text-anchor="middle" font-size="26" font-weight="800" fill="#17A673">›</text>
  <text x="780" y="218" text-anchor="middle" font-size="26" font-weight="800" fill="#17A673">›</text>
  <text x="600" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#0E4F44">質問は3個まで。「何を聞けば配信を分けられるか」から逆算して設計する</text>
</svg>
