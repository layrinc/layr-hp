<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="1200" height="480" rx="20" fill="#F6FAF9"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="800" fill="#0E1A1C">広告との大きな違い＝「集客資産」が残るかどうか</text>
  <g>
    <rect x="60" y="95" width="520" height="330" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <text x="320" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#5A6B6D">広告</text>
    <polyline points="120,340 190,250 260,290 330,230 400,270" fill="none" stroke="#9AA7A9" stroke-width="4" stroke-linecap="round"/>
    <polyline points="400,270 470,368 520,370" fill="none" stroke="#C63A3A" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 7"/>
    <line x1="110" y1="370" x2="530" y2="370" stroke="#E3ECEA" stroke-width="2"/>
    <rect x="365" y="176" width="130" height="30" rx="15" fill="#FDECEC"/>
    <text x="430" y="197" text-anchor="middle" font-size="12.5" font-weight="800" fill="#C63A3A">止めると流入も止まる</text>
  </g>
  <g>
    <rect x="620" y="95" width="520" height="330" rx="16" fill="#fff" stroke="#17A673" stroke-width="2.5"/>
    <text x="880" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#0E4F44">口コミ × LINEリスト</text>
    <path d="M680,360 C760,350 800,320 850,290 C910,254 990,215 1080,180 L1080,370 L680,370 Z" fill="#DFF3EA"/>
    <path d="M680,360 C760,350 800,320 850,290 C910,254 990,215 1080,180" fill="none" stroke="#17A673" stroke-width="4" stroke-linecap="round"/>
    <line x1="670" y1="370" x2="1090" y2="370" stroke="#E3ECEA" stroke-width="2"/>
    <rect x="905" y="176" width="170" height="30" rx="15" fill="#EDF7F2"/>
    <text x="990" y="197" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0E4F44">積み上がり、資産として残る</text>
  </g>
  <text x="600" y="456" text-anchor="middle" font-size="13" fill="#5A6B6D">来店客が増えるほど、口コミとリストが翌月以降の集客を助けてくれる構造になる</text>
</svg>
