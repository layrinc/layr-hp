<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="1200" height="500" rx="20" fill="#F6FAF9"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="800" fill="#0E1A1C">「即予約」と「友だち追加」で変わる回収構造</text>
  <!-- left: 従来モデル -->
  <g>
    <rect x="60" y="95" width="520" height="330" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <text x="320" y="138" text-anchor="middle" font-size="17" font-weight="800" fill="#5A6B6D">従来：着地が「予約ページ」</text>
    <rect x="90" y="165" width="130" height="85" rx="12" fill="#F6FAF9" stroke="#E3ECEA" stroke-width="1.5"/>
    <text x="155" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#0E1A1C">広告・検索</text>
    <text x="155" y="227" text-anchor="middle" font-size="11.5" fill="#5A6B6D">流入</text>
    <rect x="250" y="165" width="130" height="85" rx="12" fill="#F6FAF9" stroke="#E3ECEA" stroke-width="1.5"/>
    <text x="315" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#0E1A1C">LP来訪</text>
    <text x="315" y="227" text-anchor="middle" font-size="11.5" fill="#5A6B6D">検討</text>
    <rect x="410" y="165" width="130" height="85" rx="12" fill="#F6FAF9" stroke="#E3ECEA" stroke-width="1.5"/>
    <text x="475" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#0E1A1C">予約・購入</text>
    <text x="475" y="227" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C63A3A">数%のみ</text>
    <text x="235" y="216" text-anchor="middle" font-size="24" font-weight="800" fill="#17A673">›</text>
    <text x="395" y="216" text-anchor="middle" font-size="24" font-weight="800" fill="#17A673">›</text>
    <rect x="205" y="278" width="230" height="30" rx="15" fill="#FDECEC"/>
    <text x="320" y="298" text-anchor="middle" font-size="12.5" font-weight="800" fill="#C63A3A">90%以上が何も残さず離脱</text>
    <text x="320" y="345" text-anchor="middle" font-size="13" fill="#5A6B6D">「決められる人」を高単価で取り合うため</text>
    <text x="320" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#C63A3A">CPAは上がり続ける</text>
  </g>
  <!-- right: LINEモデル -->
  <g>
    <rect x="620" y="95" width="520" height="330" rx="16" fill="#fff" stroke="#17A673" stroke-width="2.5"/>
    <text x="880" y="138" text-anchor="middle" font-size="17" font-weight="800" fill="#0E4F44">転換：着地が「LINE友だち追加」</text>
    <rect x="645" y="165" width="100" height="85" rx="12" fill="#F6FAF9" stroke="#E3ECEA" stroke-width="1.5"/>
    <text x="695" y="203" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E1A1C">広告・検索</text>
    <text x="695" y="227" text-anchor="middle" font-size="11.5" fill="#5A6B6D">流入</text>
    <rect x="768" y="165" width="100" height="85" rx="12" fill="#EDF7F2" stroke="#17A673" stroke-width="2"/>
    <text x="818" y="203" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E4F44">友だち追加</text>
    <text x="818" y="227" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E4F44">低ハードル</text>
    <rect x="891" y="165" width="100" height="85" rx="12" fill="#F6FAF9" stroke="#E3ECEA" stroke-width="1.5"/>
    <text x="941" y="203" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E1A1C">配信で育成</text>
    <text x="941" y="227" text-anchor="middle" font-size="11.5" fill="#5A6B6D">継続接点</text>
    <rect x="1014" y="165" width="100" height="85" rx="12" fill="#F6FAF9" stroke="#E3ECEA" stroke-width="1.5"/>
    <text x="1064" y="203" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E1A1C">売上</text>
    <text x="1064" y="227" text-anchor="middle" font-size="11" fill="#5A6B6D">初回＋リピート</text>
    <text x="757" y="216" text-anchor="middle" font-size="24" font-weight="800" fill="#17A673">›</text>
    <text x="880" y="216" text-anchor="middle" font-size="24" font-weight="800" fill="#17A673">›</text>
    <text x="1003" y="216" text-anchor="middle" font-size="24" font-weight="800" fill="#17A673">›</text>
    <rect x="765" y="278" width="230" height="30" rx="15" fill="#EDF7F2"/>
    <text x="880" y="298" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0E4F44">即決しない人もLINEに残る</text>
    <text x="880" y="345" text-anchor="middle" font-size="13" fill="#5A6B6D">残った見込み客へ配信で継続アプローチ</text>
    <text x="880" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#0E4F44">追加の集客費はかからない</text>
  </g>
  <text x="600" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#0E4F44">判断基準はCPA単体ではなく、LTV（1人が生涯にもたらす売上）とのバランス</text>
</svg>
