<circle cx="600" cy="258" r="107.5" fill="#FFFFFF" stroke="url(#g)" stroke-width="9"/>
<text x="600" y="266" font-size="22" font-weight="700" fill="#000000" text-anchor="middle">開始当日告知</text>
<text x="600" y="352" font-size="13" font-weight="700" fill="#00BF63" text-anchor="middle" letter-spacing="2">STEP2</text>
