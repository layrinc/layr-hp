<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect width="1200" height="500" rx="20" fill="#F6FAF9"/>
  <text x="600" y="52" text-anchor="middle" font-size="24" font-weight="800" fill="#0E1A1C">美容サロンの例：同じ友だちでも送る内容はまったく違う</text>
  <g>
    <rect x="60" y="170" width="280" height="200" rx="16" fill="#0E4F44"/>
    <text x="200" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#9FD4C3">あいさつの質問で</text>
    <text x="200" y="258" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">属性タグを付与</text>
    <text x="200" y="292" text-anchor="middle" font-size="11.5" fill="#9FD4C3">例：来店経験の有無を聞く</text>
    <text x="200" y="336" text-anchor="middle" font-size="26">🏷️</text>
  </g>
  <g>
    <rect x="420" y="110" width="720" height="150" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <text x="470" y="163" font-size="24">🔁</text>
    <text x="780" y="163" text-anchor="middle" font-size="17" font-weight="800" fill="#0E1A1C">来店済みのお客様</text>
    <text x="780" y="205" text-anchor="middle" font-size="13" fill="#5A6B6D">メンテナンス時期のリマインドや上位メニューの案内</text>
  </g>
  <g>
    <rect x="420" y="290" width="720" height="150" rx="16" fill="#fff" stroke="#E3ECEA" stroke-width="2"/>
    <text x="470" y="343" font-size="24">🎁</text>
    <text x="780" y="343" text-anchor="middle" font-size="17" font-weight="800" fill="#0E1A1C">まだ来店していない友だち</text>
    <text x="780" y="385" text-anchor="middle" font-size="13" fill="#5A6B6D">初回オファーや店舗の雰囲気が伝わるコンテンツ</text>
  </g>
  <text x="380" y="193" text-anchor="middle" font-size="26" font-weight="800" fill="#17A673">›</text>
  <text x="380" y="373" text-anchor="middle" font-size="26" font-weight="800" fill="#17A673">›</text>
  <text x="600" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#0E4F44">出し分けを始めるだけで配信への反応率は上がり、ブロック率は下がる</text>
</svg>
