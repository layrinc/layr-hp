<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>資料請求ありがとうございます｜よろず屋マーケくん by LAYR</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ai:#1d3a4d;--ai-deep:#152936;
  --washi:#f5eeda;--washi-card:#fbf6e7;
  --shu:#b23c22;--shu-dark:#93301a;
  --ink:#332f26;--muted:#6d6555;
  --line:#d9cba4;--line-strong:#c4b184;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Sans JP',sans-serif;color:var(--ink);
  background:#fff;line-height:1.9;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.card{
  max-width:620px;width:100%;
  background:var(--washi-card);
  border:4px double var(--line-strong);
  border-radius:14px;
  padding:52px 40px;text-align:center;
  box-shadow:8px 8px 0 rgba(29,58,77,.08);
}
.mk{
  width:74px;height:74px;border-radius:50%;background:var(--ai);color:var(--washi);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:1.9rem;
  box-shadow:inset 0 0 0 4px var(--ai), inset 0 0 0 6px var(--washi);
}
h1{
  font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;font-weight:900;
  font-size:clamp(1.4rem,4.5vw,1.8rem);line-height:1.6;margin-bottom:14px;
}
p.lead{color:var(--muted);font-size:.95rem;margin-bottom:30px;}
.dl{
  display:inline-block;background:var(--shu);color:var(--washi);
  font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:1.1rem;
  letter-spacing:.06em;
  padding:17px 44px;border-radius:8px;
  box-shadow:inset 0 0 0 2px rgba(245,238,218,.35), 4px 4px 0 rgba(51,47,38,.22);
  transition:transform .15s ease, background .15s ease;
  text-decoration:none;
}
.dl:hover{background:var(--shu-dark);transform:translate(-1px,-1px);}
p.note{font-size:.8rem;color:var(--muted);margin-top:16px;}
.sep{border-top:1px dashed var(--line-strong);margin:32px 0 26px;}
.sub h2{
  font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:1.05rem;margin-bottom:8px;
}
.sub p{font-size:.88rem;color:var(--muted);margin-bottom:16px;}
.ghost{
  display:inline-block;background:transparent;color:var(--ai);
  font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
  padding:12px 32px;border-radius:8px;border:2px solid var(--ai);
  text-decoration:none;transition:background .15s ease;
}
.ghost:hover{background:#fff;}
.back{display:block;margin-top:24px;font-size:.82rem;color:var(--muted);text-decoration:underline;}
</style>
</head>
<body>
<div class="card">
  <div class="mk">萬</div>
  <h1>資料のご請求、<br>ありがとうございます</h1>
  <p class="lead">下のボタンから、サービス概要資料（PDF・全11ページ）を<br>そのままダウンロードいただけます。</p>
  <a class="dl" href="../docs/yorozuya-marke-kun-service.pdf" target="_blank" rel="noopener">資料をダウンロードする</a>
  <p class="note">同じダウンロードURLをメールでもお送りしています。<br>届かない場合は、迷惑メールフォルダをご確認ください。</p>
  <div class="sep"></div>
  <div class="sub">
    <h2>読みながら気になることがあれば</h2>
    <p>60分の無料相談で、御社の状況に合わせてご説明します。売り込みはいたしません。</p>
    <a class="ghost" href="../#contact">無料相談を申し込む</a>
  </div>
  <a class="back" href="../">← よろず屋マーケくんのページへ戻る</a>
</div>
</body>
</html>
