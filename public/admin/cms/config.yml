# =====================================================================
# Sveltia CMS 設定（WordPressの管理画面に相当）
# ここで「管理画面のフォーム項目」と「保存先」を定義する。
# パスはすべて Git リポジトリのルート（Company-Brain）からの相対。
# =====================================================================

backend:
  name: github
  repo: layrinc/company-brain      # GitHubリポジトリ
  branch: main
  # 本番の管理画面ログインには GitHub OAuth の中継URLが必要。
  # セットアップ後に下行のコメントを外し、中継URLを設定する。
  # base_url: https://<your-auth-relay>

# 画像などのアップロード先
media_folder: "株式会社LAYR/layr-hp/public/uploads"
public_folder: "/uploads"

collections:
  # ===================== 投稿（WordPressの「投稿」相当） =====================
  - name: blog
    label: コラム記事
    label_singular: コラム記事
    description: LINE公式アカウントの構築・運用に関するコラム。保存すると自動でサイトに反映されます（約1〜2分）。
    folder: "株式会社LAYR/layr-hp/src/content/blog"
    create: true
    # 記事URL = このスラッグ。英数字で入力する。
    slug: "{{fields.slug}}"
    sortable_fields: [date, title]
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "説明文（SEO・一覧に表示）", name: "description", widget: "text" }
      - { label: "URLスラッグ（英数字）", name: "slug", widget: "string", hint: "記事URLになる英語の短い名前。例: line-step-message" }
      - { label: "公開日", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - label: "カテゴリ"
        name: "category"
        widget: "select"
        options: ["LINE運用", "LINEマーケティング", "LINE構築"]
        default: "LINE運用"
      - { label: "下書き（チェック中は公開されない）", name: "draft", widget: "boolean", default: false }
      - { label: "SNSシェア画像（任意・OGP）", name: "image", widget: "image", required: false, hint: "X/LINE等でシェアされた時に出る画像。1200×630px推奨" }
      - { label: "本文", name: "body", widget: "markdown" }

  # ===================== サイト設定（WordPressの「カスタマイザー」相当） =====================
  - name: site
    label: サイト全体設定
    description: ページの内容・デザインの編集は「ページビルダー」（/admin/customize/）へ移行しました。ここは連絡先とテーマの予備編集のみ。
    files:

      # --- 基本設定 ---
      - name: settings
        label: 基本設定（連絡先・CTA）
        file: "株式会社LAYR/layr-hp/src/data/settings.json"
        fields:
          - { label: "問い合わせメールアドレス", name: "email", widget: "string" }
          - { label: "LINE友だち追加URL（空欄ならメールCTAになる）", name: "line_url", widget: "string", required: false }
          - { label: "SNSシェア画像（サイト共通・OGP）", name: "og_image", widget: "image", required: false }
          - { label: "フッターのひとこと（改行可）", name: "tagline", widget: "text" }

      # --- テーマ ---
      - name: theme
        label: デザイン設定（色・フォント）
        file: "株式会社LAYR/layr-hp/src/data/theme.json"
        fields:
          - { label: "メインカラー", name: "accent", widget: "color" }
          - { label: "メインカラー濃いめ", name: "accent_dark", widget: "color" }
          - { label: "締めの深色", name: "base_black", widget: "color" }
          - { label: "薄い背景色", name: "bg_tint", widget: "color" }
          - { label: "角丸の大きさ(px)", name: "radius", widget: "number", value_type: "int", min: 0, max: 28 }
          - label: "英字見出しのフォント"
            name: "font_en"
            widget: "select"
            options: ["Montserrat", "Archivo", "Poppins"]
          - { label: "追加CSS（上級者向け）", name: "custom_css", widget: "text", required: false }
